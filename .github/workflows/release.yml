name: Release

on:
  push:
    tags:
      - 'v*'

defaults:
  run:
    working-directory: src

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test --no-restore -v normal -c Release --results-directory test-results -l trx
        
      - name: Upload Test Results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-results
          path: src/test-results/*

      - name: Pack
        run: dotnet pack -c Release --no-build Valleysoft.DockerCredsProvider

      - name: Publish Package
        run: |
          package_path="Valleysoft.DockerCredsProvider/bin/Release/Valleysoft.DockerCredsProvider.${GITHUB_REF_NAME#v}.nupkg"
          test -f "$package_path"
          dotnet nuget push "$package_path" -k ${{secrets.NUGET_ORG_API_KEY}} -s https://nuget.org
