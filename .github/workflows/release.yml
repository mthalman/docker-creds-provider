name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-drafter
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget.org
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Prepare release
        id: prepare
        uses: mthalman/release-automation/actions/prepare-release@90551757fe8b061d4dff1a4cab12f10e58f07201 # v1.0.1

      - name: Check out validated source
        if: steps.prepare.outputs.already-published != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET Core SDK
        if: steps.prepare.outputs.already-published != 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install dependencies
        if: steps.prepare.outputs.already-published != 'true'
        working-directory: src
        run: dotnet restore

      - name: Build
        if: steps.prepare.outputs.already-published != 'true'
        working-directory: src
        run: dotnet build -c Release --no-restore

      - name: Test
        id: test
        if: steps.prepare.outputs.already-published != 'true'
        working-directory: src
        run: dotnet test --no-restore -v normal -c Release --results-directory test-results -l trx

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.test.outcome != 'skipped' && steps.prepare.outputs.already-published == 'false'
        with:
          name: test-results
          path: src/test-results/*

      - name: Pack
        if: steps.prepare.outputs.already-published != 'true'
        working-directory: src
        run: dotnet pack -c Release --no-build --output package-output Valleysoft.DockerCredsProvider

      - name: Validate package version
        if: steps.prepare.outputs.already-published != 'true'
        shell: bash
        working-directory: src
        env:
          PACKAGE_VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          expected_package="package-output/Valleysoft.DockerCredsProvider.${PACKAGE_VERSION}.nupkg"
          expected_symbols="package-output/Valleysoft.DockerCredsProvider.${PACKAGE_VERSION}.snupkg"
          shopt -s nullglob
          packages=(package-output/*.nupkg)
          symbols=(package-output/*.snupkg)

          if [[ ${#packages[@]} -ne 1 || "${packages[0]}" != "$expected_package" ]]; then
            echo "::error::Prepared version '$PACKAGE_VERSION' does not match the MinVer package: ${packages[*]:-none}."
            exit 1
          fi

          if [[ ${#symbols[@]} -ne 1 || "${symbols[0]}" != "$expected_symbols" ]]; then
            echo "::error::Prepared version '$PACKAGE_VERSION' does not match the MinVer symbol package: ${symbols[*]:-none}."
            exit 1
          fi

      - name: Upload packages
        if: steps.prepare.outputs.already-published != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-packages-${{ steps.prepare.outputs.version }}
          path: |
            src/package-output/*.nupkg
            src/package-output/*.snupkg
          if-no-files-found: error
          retention-days: 1

      - name: Log in to NuGet.org
        id: nuget-login
        if: steps.prepare.outputs.already-published != 'true'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: thalman

      - name: Publish Package
        if: steps.prepare.outputs.already-published != 'true'
        working-directory: src
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE_VERSION: ${{ steps.prepare.outputs.version }}
        run: >-
          dotnet nuget push
          "package-output/Valleysoft.DockerCredsProvider.${PACKAGE_VERSION}.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Attach packages to GitHub Release
        if: steps.prepare.outputs.already-published != 'true'
        shell: bash
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          shopt -s nullglob
          packages=(package-output/*.nupkg package-output/*.snupkg)
          gh release upload "$RELEASE_TAG" "${packages[@]}" --clobber

      - name: Finalize GitHub Release
        if: steps.prepare.outputs.already-published != 'true'
        uses: mthalman/release-automation/actions/finalize-release@90551757fe8b061d4dff1a4cab12f10e58f07201 # v1.0.1
        with:
          context: ${{ steps.prepare.outputs.context }}
