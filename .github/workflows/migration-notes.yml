name: Migration notes

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  contents: read

concurrency:
  group: migration-notes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migration-notes:
    name: Validate migration notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install migration tooling
        run: python -m pip install -r .github/scripts/requirements.txt

      - name: Test migration tooling
        run: python -B -m unittest discover -s .github/scripts -p test_migration_notes.py

      - name: Check pull request migration notes
        if: github.event_name == 'pull_request'
        run: python .github/scripts/migration_notes.py check --event "$GITHUB_EVENT_PATH"
