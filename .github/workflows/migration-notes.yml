name: Migration notes

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  contents: read

concurrency:
  group: migration-notes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migration-notes:
    name: Test migration tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install migration tooling
        run: python -m pip install -r .github/scripts/requirements.txt

      - name: Test migration tooling
        run: python -B -m unittest discover -s .github/scripts -p test_migration_notes.py
