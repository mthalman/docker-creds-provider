name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

defaults:
  run:
    working-directory: src

jobs:
  build:
    name: "Build and test on ${{ matrix.os }}"
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test --no-restore -v normal -c Release --results-directory test-results -l trx

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: src/test-results/*

  package:
    name: Pack and validate
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Pack and validate
        run: dotnet pack -c Release --no-build --output package-output Valleysoft.DockerCredsProvider

      - name: Validate package artifacts
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem package-output -Filter *.nupkg)
          $symbols = @(Get-ChildItem package-output -Filter *.snupkg)
          if ($packages.Count -ne 1 -or $symbols.Count -ne 1) {
            throw "Expected one .nupkg and one .snupkg; found $($packages.Count) and $($symbols.Count)."
          }

          $expectedPackageEntries = @(
            "_rels/.rels"
            "[Content_Types].xml"
            "package/services/metadata/core-properties/nuget.psmdcp"
            "README.md"
            "Valleysoft.DockerCredsProvider.nuspec"
          )
          $expectedSymbolEntries = @(
            "_rels/.rels"
            "[Content_Types].xml"
            "package/services/metadata/core-properties/nuget.psmdcp"
            "Valleysoft.DockerCredsProvider.nuspec"
          )
          foreach ($framework in @("netstandard2.0", "net8.0")) {
            $expectedPackageEntries += "lib/$framework/Valleysoft.DockerCredsProvider.dll"
            $expectedPackageEntries += "lib/$framework/Valleysoft.DockerCredsProvider.xml"
            $expectedSymbolEntries += "lib/$framework/Valleysoft.DockerCredsProvider.pdb"
          }

          function Assert-ArchiveEntries($path, $expectedEntries) {
            $archive = [System.IO.Compression.ZipFile]::OpenRead($path)
            try {
              $actualEntries = @($archive.Entries.FullName)
              $missingEntries = @($expectedEntries | Where-Object { $_ -notin $actualEntries })
              $unexpectedEntries = @($actualEntries | Where-Object { $_ -notin $expectedEntries })
              if ($missingEntries.Count -gt 0 -or $unexpectedEntries.Count -gt 0) {
                throw "$path has invalid contents. Missing: $($missingEntries -join ', '); unexpected: $($unexpectedEntries -join ', ')"
              }
            }
            finally {
              $archive.Dispose()
            }
          }

          Assert-ArchiveEntries $packages[0].FullName $expectedPackageEntries
          Assert-ArchiveEntries $symbols[0].FullName $expectedSymbolEntries

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: |
            src/package-output/*.nupkg
            src/package-output/*.snupkg
