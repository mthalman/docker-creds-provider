name-template: "Docker Creds Provider $RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
tag-prefix: "v"

categories:
  - type: pre-exclude
    when:
      label: skip-changelog

  - title: "Features"
    exclusive: true
    when:
      label: enhancement

  - title: "Bug Fixes"
    exclusive: true
    when:
      label: bug

  - title: "Documentation"
    exclusive: true
    when:
      label: documentation

  - title: "Dependencies"
    exclusive: true
    collapse-after: 5
    when:
      label: dependencies

  - title: "Maintenance"

  - type: version-resolver
    semver-increment: major
    when:
      label: semver:major

  - type: version-resolver
    semver-increment: minor
    when:
      label: semver:minor

  - type: version-resolver
    semver-increment: patch
    when:
      label: semver:patch

  - type: version-resolver
    semver-increment: patch

change-template: "- $TITLE (#$NUMBER) by $AUTHORS"
change-title-escapes: '\<*_&'
template: |
  ## What's Changed

  $CHANGES
